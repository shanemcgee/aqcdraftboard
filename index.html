<!--

    Owner/Creator: Shane McGee
    Copyright: © 2026 Shane McGee. All rights reserved.
    Application: AQC 2026 Fantasy Football Draft Board (Commissioner Admin Page)
    
    SECTION-BY-SECTION FUNCTIONAL BREAKDOWN:
    
    1. Header Bar (Title, Team Roster Viewer Button & Live Countdown Timer)
       - Function: Displays the main application title, a button to inspect team rosters, 
         and a built-in draft clock. Features an interactive dropdown allowing the 
         commissioner to toggle timer durations (2:00, 1:30, 1:00) with audio beeps.
    
    2. Team Roster Modal Overlay
       - Function: Allows viewing selections made by any specific team manager in an 
         organized list format with round and pick numbers directly from the admin interface.
    
    3. Player Pool Setup Banner
       - Function: Serves as the initial onboarding mechanism for the player data CSV.
    
    4. Draft Order Setup Banner
       - Function: Handles the configuration of league manager names and pick sequence via CSV.
    
    5. Controls Area (Search Input & Management Buttons)
       - Search Container: Features a dynamic, real-time autocomplete search box that 
         filters through available players while automatically hiding already-drafted athletes.
       - Action Buttons Group: 
         * Add Custom Player: Allows manually adding a non-existent player via prompts.
         * Save Board: Exports the current draft state into a timestamped CSV file.
         * Reset to Pick 1: Clears all active selections from the board to start over.
         * Revert Last Pick: Undoes the most recent selection.
         * Reset Draft Order: Triggers the CSV upload banner to update team names.
         * Reset Players: Completely wipes localStorage caches.
    
    6. Draft Board Grid Table
       - Function: The core **10**-team, **15**-round serpentine draft visualization matrix 
         with color-coded position styling.
    ========================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQC 2026 Fantasy Football Draft Board - Commissioner Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa; /* Subtle cool off-white/gray */
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(16, 37, 66, 0.08); /* Subtle navy shadow */
            border-top: 4px solid #1d3557; /* Subtle patriotic navy accent */
            border-radius: 4px;
        }

        /* Top Header Bar containing Title, Roster Viewer Button, and Timer */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            color: #1d3557; /* Patriotic Navy */
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        .header-left-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button#viewTeamRosterBtn {
            background-color: #457b9d; /* Steel blue */
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button#viewTeamRosterBtn:hover {
            background-color: #36617d;
        }

        /* Timer Widget Style */
        .timer-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1d3557; /* Patriotic Navy */
            color: #fff;
            padding: 8px 15px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .timer-display {
            font-size: 22px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
            min-width: 65px;
            text-align: center;
        }

        .timer-display.urgent {
            color: #ff6b6b;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .timer-select {
            background: #2b4c7e; /* Slightly lighter navy */
            color: #fff;
            border: 1px solid #457b9d;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        .timer-select:focus {
            outline: none;
            border-color: #a8dadc;
        }

        /* Modal Overlay Styles */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(13, 27, 42, 0.6); /* Dark semi-transparent backdrop */
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 25px;
            border: 1px solid #cbd5e1;
            width: 90%;
            max-width: 700px;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-modal-btn {
            color: #64748b;
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close-modal-btn:hover {
            color: #1d3557;
        }

        .modal-header {
            margin-top: 0;
            margin-bottom: 20px;
            color: #1d3557;
            font-size: 22px;
        }

        .roster-select-container {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .roster-select-container label {
            font-weight: bold;
            color: #1e293b;
            font-size: 14px;
        }

        .roster-select {
            background: #f8fafc;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            flex-grow: 1;
            max-width: 350px;
        }

        .roster-select:focus {
            outline: none;
            border-color: #457b9d;
            background-color: #fff;
        }

        .roster-table-container {
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }

        .roster-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .roster-table th, .roster-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .roster-table th {
            background-color: #1d3557;
            color: #fff;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .roster-table tr:hover {
            background-color: #f1f5f9;
        }

        .empty-roster-msg {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-style: italic;
        }

        /* Setup Banners for CSVs */
        .setup-banner {
            background: #f1faee; /* Subtle pale blue-white */
            border: 1px solid #a8dadc;
            color: #1d3557;
            padding: 12px 15px;
            text-align: center;
            margin-bottom: 12px;
            border-radius: 4px;
            font-size: 14px;
        }

        .setup-banner input[type=file] {
            margin-left: 10px;
            font-size: 13px;
        }

        /* Top Controls Area with Search on Left and Horizontal Buttons Group on Right */
        .controls-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 20px;
        }

        .search-container {
            position: relative;
            flex-grow: 1;
        }

        input[type=text] {
            width: 100%;
            max-width: 450px;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background-color: #f8fafc;
        }

        input[type=text]:focus {
            outline: none;
            border-color: #457b9d;
            background-color: #fff;
        }

        /* Horizontal Buttons Wrapper on the Right */
        .buttons-group {
            display: flex;
            flex-direction: row;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        button#revertBtn, button#saveCsvBtn, button#resetDraftBtn, button#resetCsvBtn, button#resetDraftOrderBtn, button#addCustomPlayerBtn {
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            white-space: nowrap;
        }

        button#revertBtn {
            background-color: #b7322c; /* Muted patriotic red */
        }
        button#revertBtn:hover {
            background-color: #9c2721;
        }

        button#saveCsvBtn {
            background-color: #1d3557; /* Patriotic Navy */
        }
        button#saveCsvBtn:hover {
            background-color: #152945;
        }

        button#resetDraftBtn {
            background-color: #d97706; /* Amber/Orange */
        }
        button#resetDraftBtn:hover {
            background-color: #b45309;
        }

        button#resetDraftOrderBtn {
            background-color: #457b9d; /* Steel blue */
        }
        button#resetDraftOrderBtn:hover {
            background-color: #36617d;
        }

        button#addCustomPlayerBtn {
            background-color: #2b6cb0; /* Custom blue */
        }
        button#addCustomPlayerBtn:hover {
            background-color: #2c5282;
        }

        button#resetCsvBtn {
            background-color: #64748b;
        }
        button#resetCsvBtn:hover {
            background-color: #475569;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid #cbd5e1;
            text-align: center;
            vertical-align: middle;
            padding: 4px;
            line-height: 1.2;
        }

        /* Round Column Header & Cells */
        th.round-th {
            width: 5%;
            background-color: #1d3557; /* Patriotic Navy */
            color: #fff;
            font-size: 14px;
        }

        td.round-td {
            width: 5%;
            background-color: #f1f5f9; /* Soft cool gray-blue tint */
            font-weight: bold;
            font-size: 13px;
            color: #1d3557;
            height: 60px;
        }

        /* Player Team Cells */
        td.player-td {
            width: 9.5%;
            height: 60px;
            background-color: #ffffff;
            position: relative;
        }

        th.team-th {
            width: 9.5%;
            background-color: #1d3557; /* Patriotic Navy */
            color: #fff;
            font-size: 14px;
        }

        /* Draft cell typography: Name is bold and larger than details */
        td .player-name {
            font-size: 15px;
            font-weight: bold;
        }

        td .player-details {
            font-size: 10px;
            font-weight: bold;
            margin-top: 2px;
        }

        /* Very small pick number in the bottom corner */
        td .pick-number {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 8px;
            font-weight: bold;
            opacity: 0.75;
            line-height: 1;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #fff;
            width: 450px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.15);
            z-index: 100;
            left: 0;
            border: 1px solid #cbd5e1;
            text-align: left;
        }

        .dropdown-content div {
            color: #1e293b;
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .dropdown-content div:hover { 
            background-color: #f1f5f9; 
        }

        /* Position Color-Coding Classes (Set to opacity ~0.56, balancing a 7 on a 1-10 scale) */
        .QB-cell { 
            background-color: rgba(255, 165, 0, 0.56) !important; /* Orange */
            color: #0d1b2a !important;
        } 

        .RB-cell { 
            background-color: rgba(46, 125, 50, 0.53) !important; /* Green */
            color: #0d1b2a !important;
        } 

        .WR-cell { 
            background-color: rgba(255, 235, 59, 0.62) !important; /* Yellow */
            color: #0d1b2a !important;
        } 

        .TE-cell { 
            background-color: rgba(156, 39, 176, 0.50) !important; /* Purple */
            color: #0d1b2a !important;
        } 

        .K-cell { 
            background-color: rgba(244, 143, 177, 0.60) !important; /* Pink */
            color: #0d1b2a !important;
        } 

        .DST-cell { 
            background-color: rgba(183, 28, 28, 0.50) !important; /* Burgundy/Red */
            color: #0d1b2a !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Bar with Title, Roster Viewer Button, and Timer on Top Right -->
        <div class="header-bar">
            <div class="header-left-actions">
                <h1>AQC 2026 Fantasy Football Draft Board</h1>
                <button id="viewTeamRosterBtn">View Team Rosters</button>
            </div>
            <div class="timer-container">
                <div id="timerDisplay" class="timer-display">02:00</div>
                <select id="timerDuration" class="timer-select">
                    <option value="120" selected>2:00</option>
                    <option value="90">1:30</option>
                    <option value="60">1:00</option>
                </select>
            </div>
        </div>
        
        <!-- Player List CSV Upload Banner -->
        <div id="setupBanner" class="setup-banner">
            <strong>1. Player Pool Setup:</strong> Upload your players list in CSV format:
            <input type="file" id="csvFileInput" accept=".csv">
        </div>

        <!-- Draft Order CSV Upload Banner -->
        <div id="draftOrderBanner" class="setup-banner" style="display: none;">
            <strong>Upload Draft Order:</strong> Upload your new draft order CSV file to replace team names at the top:
            <input type="file" id="draftOrderInput" accept=".csv">
        </div>

        <!-- Controls Area (Search on left, Horizontal smaller buttons on right) -->
        <div class="controls-container">
            <div class="search-container">
                <input type="text" id="playerSearch" placeholder="Type player name (e.g., Gi)..." autocomplete="off" disabled>
                <div id="searchResults" class="dropdown-content"></div>
            </div>
            <div class="buttons-group">
                <button id="addCustomPlayerBtn">Add Custom Player</button>
                <button id="saveCsvBtn">Save Board</button>
                <button id="resetDraftBtn">Reset to Pick 1</button>
                <button id="revertBtn">Revert Last Pick</button>
                <button id="resetDraftOrderBtn">Reset Draft Order</button>
                <button id="resetCsvBtn" title="Load a new CSV file">Reset Players</button>
            </div>
        </div>

        <!-- Draft Board Grid Table with Round Column -->
        <div class="table-responsive">
            <table id="draftBoard">
                <thead>
                    <tr id="headerRow"></tr>
                </thead>
                <tbody id="boardBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Team Roster Modal Overlay -->
    <div id="rosterModal" class="modal-overlay">
        <div class="modal-content">
            <span id="closeModalBtn" class="close-modal-btn">&times;</span>
            <h2 class="modal-header">Team Roster Inspector</h2>
            
            <div class="roster-select-container">
                <label for="teamSelectDropdown">Select Team:</label>
                <select id="teamSelectDropdown" class="roster-select"></select>
            </div>

            <div class="roster-table-container">
                <table class="roster-table">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Round</th>
                            <th style="width: 15%;">Pick #</th>
                            <th style="width: 35%;">Player</th>
                            <th style="width: 15%;">Position</th>
                            <th style="width: 20%;">NFL Team</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTableBody">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Embedded PapaParse lightweight CSV parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        let players = [];
        let teamNames = [];
        let currentDraftIndex = 0; 
        const totalTeams = 10;
        const totalRounds = 15;
        const totalCells = totalTeams * totalRounds;

        let draftedPicksHistory = [];

        const searchInput = document.getElementById("playerSearch");
        const resultsContainer = document.getElementById("searchResults");
        const saveCsvBtn = document.getElementById("saveCsvBtn");
        const resetDraftBtn = document.getElementById("resetDraftBtn");
        const resetDraftOrderBtn = document.getElementById("resetDraftOrderBtn");
        const addCustomPlayerBtn = document.getElementById("addCustomPlayerBtn");
        const revertBtn = document.getElementById("revertBtn");
        const setupBanner = document.getElementById("setupBanner");
        const draftOrderBanner = document.getElementById("draftOrderBanner");
        const resetCsvBtn = document.getElementById("resetCsvBtn");
        const csvFileInput = document.getElementById("csvFileInput");
        const draftOrderInput = document.getElementById("draftOrderInput");
        
        const viewTeamRosterBtn = document.getElementById("viewTeamRosterBtn");
        const rosterModal = document.getElementById("rosterModal");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const teamSelectDropdown = document.getElementById("teamSelectDropdown");
        const rosterTableBody = document.getElementById("rosterTableBody");

        const timerDisplay = document.getElementById("timerDisplay");
        const timerDurationSelect = document.getElementById("timerDuration");
        let countdownInterval = null;
        let timeRemaining = 120;
        let timerRunning = false;

        // Web Audio API context for beep sounds
        let audioCtx = null;

        function playBeep(isFinal = false) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(isFinal ? 1046.5 : 880, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (isFinal ? 1.0 : 0.2));
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + (isFinal ? 1.0 : 0.2));
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            loadTeamNamesFromStorage();
            initializeBoard();
            populateTeamDropdown();
            updateTimerDisplay();
            
            const cachedData = localStorage.getItem("rotoballer_players");
            if (cachedData) {
                players = JSON.parse(cachedData);
                setupBanner.style.display = "none";
                searchInput.disabled = false;
                searchInput.placeholder = `Type player name (${players.length} players loaded)...`;
            }

            const savedDraftOrder = localStorage.getItem("aqc_team_names");
            if (!savedDraftOrder) {
                draftOrderBanner.style.display = "block";
            }

            const savedDraftState = localStorage.getItem("aqc_draft_state");
            if (savedDraftState) {
                try {
                    const parsedState = JSON.parse(savedDraftState);
                    parsedState.forEach(pick => {
                        applyPickToBoard(pick.round, pick.team, pick.playerObj, pick.pickNumber, false);
                    });
                } catch (e) {
                    console.error("Could not restore previous draft state", e);
                }
            }
        });

        // Modal Open / Close Event Handlers
        viewTeamRosterBtn.addEventListener("click", () => {
            populateTeamDropdown();
            renderTeamRoster();
            rosterModal.style.display = "flex";
        });

        closeModalBtn.addEventListener("click", () => {
            rosterModal.style.display = "none";
        });

        window.addEventListener("click", (e) => {
            if (e.target === rosterModal) {
                rosterModal.style.display = "none";
            }
        });

        teamSelectDropdown.addEventListener("change", () => {
            renderTeamRoster();
        });

        function populateTeamDropdown() {
            const currentSelectedValue = teamSelectDropdown.value;
            teamSelectDropdown.innerHTML = "";
            
            for (let t = 1; t <= totalTeams; t++) {
                const teamName = teamNames[t - 1] || `Team ${t}`;
                const option = document.createElement("option");
                option.value = t;
                option.textContent = `${t}. ${teamName}`;
                teamSelectDropdown.appendChild(option);
            }

            if (currentSelectedValue) {
                teamSelectDropdown.value = currentSelectedValue;
            }
        }

        function renderTeamRoster() {
            const selectedTeamNum = parseInt(teamSelectDropdown.value) || 1;
            rosterTableBody.innerHTML = "";

            const teamPicks = draftedPicksHistory.filter(pick => pick.team === selectedTeamNum);
            teamPicks.sort((a, b) => a.pickNumber - b.pickNumber);

            if (teamPicks.length === 0) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 5;
                td.className = "empty-roster-msg";
                td.textContent = "No players drafted by this team yet.";
                tr.appendChild(td);
                rosterTableBody.appendChild(tr);
                return;
            }

            teamPicks.forEach(pick => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>Round ${pick.round}</strong></td>
                    <td>#${pick.pickNumber}</td>
                    <td><strong>${pick.playerObj.Player}</strong></td>
                    <td>${pick.playerObj.Position || "N/A"}</td>
                    <td>${pick.playerObj.Team || "N/A"}</td>
                `;
                rosterTableBody.appendChild(tr);
            });
        }

        timerDurationSelect.addEventListener("change", function() {
            timeRemaining = parseInt(this.value);
            updateTimerDisplay();
        });

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeRemaining <= 10 && timeRemaining > 0) {
                timerDisplay.classList.add('urgent');
            } else {
                timerDisplay.classList.remove('urgent');
            }
        }

        function startTimer() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            timeRemaining = parseInt(timerDurationSelect.value);
            updateTimerDisplay();
            timerRunning = true;

            countdownInterval = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateTimerDisplay();
                    
                    if (timeRemaining <= 10 && timeRemaining > 0) {
                        playBeep(false);
                    } else if (timeRemaining === 0) {
                        playBeep(true);
                    }
                } else {
                    clearInterval(countdownInterval);
                    timerRunning = false;
                }
            }, 1000);
        }

        // Player Pool CSV upload
        csvFileInput.addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    players = results.data;
                    localStorage.setItem("rotoballer_players", JSON.stringify(players));
                    setupBanner.style.display = "none";
                    searchInput.disabled = false;
                    searchInput.placeholder = `Type player name (${players.length} players loaded)...`;
                    alert(`Successfully loaded all ${players.length} players from your CSV!`);
                },
                error: function(err) {
                    alert("Error parsing CSV: " + err.message);
                }
            });
        });

        // Click handler for Reset Draft Order button
        resetDraftOrderBtn.addEventListener("click", function() {
            draftOrderBanner.style.display = "block";
            draftOrderBanner.scrollIntoView({ behavior: 'smooth' });
        });

        // Add Custom Player Button Trigger (asks prompts matching player CSV schema)
        addCustomPlayerBtn.addEventListener("click", function() {
            if (currentDraftIndex >= totalCells) {
                alert("Draft board is full!");
                return;
            }

            const playerName = prompt("What is the player's name?");
            if (!playerName || !playerName.trim()) return;

            const playerPos = prompt("What is the player's position? (e.g., QB, RB, WR, TE, K, DST)");
            const playerTeam = prompt("What is the player's NFL team? (e.g., KC, SF, FA)");
            const playerBye = prompt("What is the player's Bye week?");

            const customPlayerObj = {
                Player: playerName.trim(),
                Position: playerPos ? playerPos.trim().toUpperCase() : "FLEX",
                Team: playerTeam ? playerTeam.trim().toUpperCase() : "FA",
                Bye: playerBye ? playerBye.trim() : "N/A"
            };

            players.push(customPlayerObj);
            localStorage.setItem("rotoballer_players", JSON.stringify(players));

            const nextPickNum = currentDraftIndex + 1;
            const roundNum = Math.ceil(nextPickNum / totalTeams);
            let teamNum;
            const remainder = nextPickNum % totalTeams;
            
            if (roundNum % 2 !== 0) {
                teamNum = remainder === 0 ? totalTeams : remainder;
            } else {
                teamNum = remainder === 0 ? 1 : (totalTeams - remainder + 1);
            }

            applyPickToBoard(roundNum, teamNum, customPlayerObj, nextPickNum, true);
            startTimer();
        });

        // Draft Order CSV upload
        draftOrderInput.addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: false,
                skipEmptyLines: true,
                complete: function(results) {
                    let extractedTeams = [];
                    const rows = results.data;

                    for (let i = 0; i < rows.length; i++) {
                        for (let j = 0; j < rows[i].length; j++) {
                            const val = rows[i][j] ? rows[i][j].trim() : "";
                            if (val && !val.toLowerCase().startsWith("round")) {
                                extractedTeams.push(val);
                            }
                        }
                    }

                    teamNames = extractedTeams.slice(0, totalTeams);

                    if (teamNames.length < totalTeams) {
                        let flat = rows.flat().map(v => v ? v.trim() : "").filter(v => v.length > 0);
                        teamNames = flat.slice(0, totalTeams);
                    }

                    while (teamNames.length < totalTeams) {
                        teamNames.push(`Team ${teamNames.length + 1}`);
                    }

                    localStorage.setItem("aqc_team_names", JSON.stringify(teamNames));
                    draftOrderBanner.style.display = "none";
                    draftOrderInput.value = "";
                    initializeBoard();
                    populateTeamDropdown();
                    alert(`Successfully updated draft order with ${teamNames.length} managers!`);
                },
                error: function(err) {
                    alert("Error parsing draft order CSV: " + err.message);
                }
            });
        });

        function loadTeamNamesFromStorage() {
            const savedTeams = localStorage.getItem("aqc_team_names");
            if (savedTeams) {
                try {
                    teamNames = JSON.parse(savedTeams);
                } catch (e) {
                    teamNames = [];
                }
            }
            if (!teamNames || teamNames.length !== totalTeams) {
                teamNames = [];
                for (let t = 1; t <= totalTeams; t++) {
                    teamNames.push(`Team ${t}`);
                }
            }
        }

        resetCsvBtn.addEventListener("click", function() {
            if (confirm("Do you want to clear the saved player list, draft order, and draft progress to start over?")) {
                localStorage.removeItem("rotoballer_players");
                localStorage.removeItem("aqc_team_names");
                localStorage.removeItem("aqc_draft_state");
                location.reload();
            }
        });

        function initializeBoard() {
            const headerRow = document.getElementById("headerRow");
            const boardBody = document.getElementById("boardBody");

            headerRow.innerHTML = "";
            boardBody.innerHTML = "";

            const roundTh = document.createElement("th");
            roundTh.textContent = "Round";
            roundTh.className = "round-th";
            headerRow.appendChild(roundTh);

            for (let t = 1; t <= totalTeams; t++) {
                const th = document.createElement("th");
                th.textContent = teamNames[t - 1] || `Team ${t}`;
                th.className = "team-th";
                headerRow.appendChild(th);
            }

            for (let r = 1; r <= totalRounds; r++) {
                const tr = document.createElement("tr");

                const roundTd = document.createElement("td");
                roundTd.textContent = r;
                roundTd.className = "round-td";
                tr.appendChild(roundTd);

                for (let t = 1; t <= totalTeams; t++) {
                    const td = document.createElement("td");
                    td.setAttribute("data-round", r);
                    td.setAttribute("data-team", t);
                    td.setAttribute("data-index", ((r - 1) * totalTeams) + (t - 1));
                    td.className = "player-td";
                    td.textContent = "";
                    tr.appendChild(td);
                }
                boardBody.appendChild(tr);
            }
        }

        function applyPickToBoard(round, team, playerObj, pickNum, recordHistory = true) {
            const cellIndex = ((round - 1) * totalTeams) + (team - 1);
            const targetCell = document.querySelector(`td[data-index='${cellIndex}']`);
            
            if (targetCell) {
                targetCell.innerHTML = `
                    <div class="player-name">${playerObj.Player}</div>
                    <div class="player-details">${playerObj.Position} - ${playerObj.Team} | Bye: ${playerObj.Bye}</div>
                    <div class="pick-number">${pickNum}</div>
                `;
                
                targetCell.className = "player-td";
                const pos = playerObj.Position ? playerObj.Position.trim() : "";
                targetCell.classList.add(`${pos}-cell`);

                if (recordHistory) {
                    draftedPicksHistory.push({ round, team, playerObj, pickNumber: pickNum });
                    currentDraftIndex = pickNum;
                    localStorage.setItem("aqc_draft_state", JSON.stringify(draftedPicksHistory));
                } else {
                    currentDraftIndex = Math.max(currentDraftIndex, pickNum);
                    draftedPicksHistory.push({ round, team, playerObj, pickNumber: pickNum });
                }

                if (rosterModal.style.display === "flex") {
                    renderTeamRoster();
                }
            }
        }

        saveCsvBtn.addEventListener("click", function() {
            let csvRows = [];
            
            let headerCols = ["Round"];
            for (let t = 1; t <= totalTeams; t++) {
                headerCols.push(teamNames[t - 1] || `Team ${t}`);
            }
            csvRows.push(headerCols.map(escapeCsvValue).join(","));

            for (let r = 1; r <= totalRounds; r++) {
                let rowData = [r];
                for (let t = 1; t <= totalTeams; t++) {
                    const cellIndex = ((r - 1) * totalTeams) + (t - 1);
                    const cell = document.querySelector(`td[data-index='${cellIndex}']`);
                    if (cell && cell.querySelector('.player-name')) {
                        const name = cell.querySelector('.player-name').textContent;
                        const details = cell.querySelector('.player-details').textContent;
                        const pNum = cell.querySelector('.pick-number').textContent;
                        rowData.push(`${name} (${details}) [Pick #${pNum}]`);
                    } else {
                        rowData.push("");
                    }
                }
                csvRows.push(rowData.map(escapeCsvValue).join(","));
            }

            const csvString = csvRows.join("\n");
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.setAttribute("download", `pick${currentDraftIndex}.csv`);
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        });

        resetDraftBtn.addEventListener("click", function() {
            if (confirm("Are you sure you want to clear all picks and reset the draft back to Pick 1? (Your player list and draft order will remain).")) {
                draftedPicksHistory = [];
                currentDraftIndex = 0;
                localStorage.removeItem("aqc_draft_state");
                
                const allPlayerCells = document.querySelectorAll("td.player-td");
                allPlayerCells.forEach(cell => {
                    cell.textContent = "";
                    cell.className = "player-td";
                });

                if (rosterModal.style.display === "flex") {
                    renderTeamRoster();
                }
            }
        });

        function escapeCsvValue(val) {
            if (val === null || val === undefined) return '""';
            let stringVal = String(val);
            if (stringVal.includes('"') || stringVal.includes(',') || stringVal.includes('\n')) {
                stringVal = stringVal.replace(/"/g, '""');
            }
            return `"${stringVal}"`;
        }

        searchInput.addEventListener("input", function() {
            const input = this.value.trim().toLowerCase();
            resultsContainer.innerHTML = "";
            
            if (input.length > 0) {
                const draftedNames = draftedPicksHistory.map(p => p.playerObj.Player);
                const matches = players.filter(player => {
                    const isMatch = player.Player && player.Player.toLowerCase().includes(input);
                    const notDrafted = !draftedNames.includes(player.Player);
                    return isMatch && notDrafted;
                });
                
                matches.forEach(match => {
                    const div = document.createElement("div");
                    div.textContent = `${match.Player} - ${match.Position} (${match.Team}) [Bye: ${match.Bye}]`;
                    
                    div.addEventListener("click", () => {
                        if (currentDraftIndex >= totalCells) {
                            alert("Draft board is full!");
                            return;
                        }

                        const nextPickNum = currentDraftIndex + 1;
                        const roundNum = Math.ceil(nextPickNum / totalTeams);
                        let teamNum;
                        const remainder = nextPickNum % totalTeams;
                        
                        if (roundNum % 2 !== 0) {
                            teamNum = remainder === 0 ? totalTeams : remainder;
                        } else {
                            teamNum = remainder === 0 ? 1 : (totalTeams - remainder + 1);
                        }

                        applyPickToBoard(roundNum, teamNum, match, nextPickNum, true);

                        resultsContainer.style.display = "none";
                        searchInput.value = "";

                        startTimer();
                    });
                    
                    resultsContainer.appendChild(div);
                });
                
                resultsContainer.style.display = matches.length > 0 ? "block" : "none";
            } else {
                resultsContainer.style.display = "none";
            }
        });

        revertBtn.addEventListener("click", function() {
            if (draftedPicksHistory.length <= 0) {
                alert("No picks to revert!");
                return;
            }

            const lastPick = draftedPicksHistory.pop();
            const cellIndex = ((lastPick.round - 1) * totalTeams) + (lastPick.team - 1);
            const targetCell = document.querySelector(`td[data-index='${cellIndex}']`);
            if (targetCell) {
                targetCell.textContent = "";
                targetCell.className = "player-td";
            }

            currentDraftIndex = draftedPicksHistory.length;
            localStorage.setItem("aqc_draft_state", JSON.stringify(draftedPicksHistory));

            if (rosterModal.style.display === "flex") {
                renderTeamRoster();
            }
        });

        document.addEventListener("click", function(e) {
            if (!e.target.closest('.search-container')) {
                resultsContainer.style.display = "none";
            }
        });
    </script>
</body>
</html>
