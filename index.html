    Application: AQC 2026 Fantasy Football Draft Board (Commissioner Control Panel)
    
    SECTION-BY-SECTION FUNCTIONAL BREAKDOWN:
    
    1. Top Control Bar (Commissioner Actions & Navigation)
       - Function: Houses primary control buttons including opening the Team Manager Name 
         Modal, opening the Draft Board Viewer link, resetting the draft, undoing the last pick, 
         and exporting/importing draft backup data.
    
    2. Left Panel: Player Pool & Search/Filter Interface
       - Function: Loads raw player data from CSV via PapaParse and displays available players.
       - Features real-time search box and multi-position filter tabs (All, QB, RB, WR, TE, K, DST).
       - Clicking any available player instantly triggers the Pick Assignment modal.
    
    3. Right Panel: Live Master Draft Board Grid (Serpentine 10-Team, 15-Round Matrix)
       - Function: Visualizes the entire 15-round serpentine draft board.
       - Each drafted cell is color-coded by position (Orange=QB, Green=RB, Yellow=WR, etc.) 
         and displays player name, position, NFL team, bye week, and absolute pick number.
       - Clicking any drafted player cell allows quick removal/editing of that pick.
    ========================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQC 2026 Fantasy Football Draft Board</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            
            --pos-qb: #ef4444;
            --pos-rb: #3b82f6;
            --pos-wr: #10b981;
            --pos-te: #f59e0b;
            --pos-k: #8b5cf6;
            --pos-def: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #fff;
        }

        .controls-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.btn-danger {
            background-color: var(--danger);
        }
        button.btn-danger:hover {
            background-color: #dc2626;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .draft-board-wrapper {
            flex: 1;
            padding: 16px;
            overflow: auto;
            background-color: #090d16;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(140px, 1fr));
            gap: 8px;
            min-width: max-content;
        }

        .team-column {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .team-header {
            background-color: #0f172a;
            padding: 8px 10px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .draft-slots {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
        }

        .draft-slot {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px dashed var(--border-color);
            border-radius: 4px;
            height: 42px;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            font-size: 0.75rem;
        }

        .draft-slot.filled {
            border: 1px solid var(--border-color);
            border-style: solid;
            background-color: #1e293b;
        }

        .draft-slot .pick-num {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        .draft-slot .player-info {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .draft-slot .p-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85px;
        }

        .badge {
            font-size: 0.6rem;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-qb { background-color: var(--pos-qb); color: white; }
        .badge-rb { background-color: var(--pos-rb); color: white; }
        .badge-wr { background-color: var(--pos-wr); color: white; }
        .badge-te { background-color: var(--pos-te); color: white; }
        .badge-k  { background-color: var(--pos-k); color: white; }
        .badge-def{ background-color: var(--pos-def); color: white; }

        .sidebar {
            width: 320px;
            background-color: var(--bg-card);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-section h2 {
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .on-the-clock-box {
            background-color: #0f172a;
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .otc-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .otc-team {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 4px;
            color: #fff;
        }

        .otc-pick {
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 2px;
        }

        .player-pool-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 16px;
        }

        .search-filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        input, select {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.875rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        input {
            flex: 1;
        }

        .player-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: #0f172a;
        }

        .player-item {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .player-item:hover {
            background-color: rgba(59, 130, 246, 0.15);
        }

        .player-item-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-item-name {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .player-item-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .undo-slot-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 2px 6px;
            margin-top: 2px;
        }
        .undo-slot-btn:hover {
            text-decoration: underline;
            background: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>AQC 2026 FANTASY FOOTBALL DRAFT BOARD</h1>
        <div class="controls-group">
            <span id="current-pick-counter" style="font-size: 0.875rem; font-weight: 600; color: var(--text-muted);">Overall Pick: 1</span>
            <button class="btn-danger" onclick="resetDraft()">Reset Draft</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Draft Board Grid -->
        <div class="draft-board-wrapper">
            <div id="board-grid" class="board-grid">
                <!-- Dynamically generated via JS -->
            </div>
        </div>

        <!-- Sidebar / Controls / Player Pool -->
        <div class="sidebar">
            <div class="sidebar-section">
                <h2>Current Pick</h2>
                <div class="on-the-clock-box">
                    <div class="otc-label">On The Clock</div>
                    <div id="otc-team-name" class="otc-team">Team 1</div>
                    <div id="otc-pick-info" class="otc-pick">Round 1, Pick 1</div>
                </div>
            </div>

            <div class="player-pool-container">
                <h2>Available Players</h2>
                <div class="search-filter-group">
                    <input type="text" id="player-search" placeholder="Search player..." oninput="filterPlayers()">
                    <select id="pos-filter" onchange="filterPlayers()">
                        <option value="ALL">All Pos</option>
                        <option value="QB">QB</option>
                        <option value="RB">RB</option>
                        <option value="WR">WR</option>
                        <option value="TE">TE</option>
                        <option value="K">K</option>
                        <option value="DEF">DEF</option>
                    </select>
                </div>
                <div id="player-list" class="player-list">
                    <!-- Dynamically generated via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const totalTeams = 10;
        const totalRounds = 16;
        
        const teams = [
            "Team 1", "Team 2", "Team 3", "Team 4", "Team 5", 
            "Team 6", "Team 7", "Team 8", "Team 9", "Team 10"
        ];

        let players = [
            { id: 1, name: "Patrick Mahomes", pos: "QB", team: "KC" },
            { id: 2, name: "Josh Allen", pos: "QB", team: "BUF" },
            { id: 3, name: "Jalen Hurts", pos: "QB", team: "PHI" },
            { id: 4, name: "Lamar Jackson", pos: "QB", team: "BAL" },
            { id: 5, name: "Christian McCaffrey", pos: "RB", team: "SF" },
            { id: 6, name: "Breece Hall", pos: "RB", team: "NYJ" },
            { id: 7, name: "Bijan Robinson", pos: "RB", team: "ATL" },
            { id: 8, name: "Jonathan Taylor", pos: "RB", team: "IND" },
            { id: 9, name: "Jahmyr Gibbs", pos: "RB", team: "DET" },
            { id: 10, name: "Saquon Barkley", pos: "RB", team: "PHI" },
            { id: 11, name: "CeeDee Lamb", pos: "WR", team: "DAL" },
            { id: 12, name: "Tyreek Hill", pos: "WR", team: "MIA" },
            { id: 13, name: "Ja'Marr Chase", pos: "WR", team: "CIN" },
            { id: 14, name: "Justin Jefferson", pos: "WR", team: "MIN" },
            { id: 15, name: "Amon-Ra St. Brown", pos: "WR", team: "DET" },
            { id: 16, name: "A.J. Brown", pos: "WR", team: "PHI" },
            { id: 17, name: "Sam LaPorta", pos: "TE", team: "DET" },
            { id: 18, name: "Travis Kelce", pos: "TE", team: "KC" },
            { id: 19, name: "Mark Andrews", pos: "TE", team: "BAL" },
            { id: 20, name: "Trey McBride", pos: "TE", team: "ARI" },
            { id: 21, name: "Anthony Richardson", pos: "QB", team: "IND" },
            { id: 22, name: "Joe Burrow", pos: "QB", team: "CIN" },
            { id: 23, name: "Kyren Williams", pos: "RB", team: "LAR" },
            { id: 24, name: "Derrick Henry", pos: "RB", team: "BAL" },
            { id: 25, name: "De'Von Achane", pos: "RB", team: "MIA" },
            { id: 26, name: "Garrett Wilson", pos: "WR", team: "NYJ" },
            { id: 27, name: "Drake London", pos: "WR", team: "ATL" },
            { id: 28, name: "Marvin Harrison Jr.", pos: "WR", team: "ARI" },
            { id: 29, name: "Puka Nacua", pos: "WR", team: "LAR" },
            { id: 30, name: "Deebo Samuel", pos: "WR", team: "SF" }
        ];

        let draftPicks = new Array(totalTeams * totalRounds).fill(null);

        function initBoard() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';

            for (let t = 0; t < totalTeams; t++) {
                const teamCol = document.createElement('div');
                teamCol.className = 'team-column';

                const teamHeader = document.createElement('div');
                teamHeader.className = 'team-header';
                teamHeader.innerText = teams[t];
                teamCol.appendChild(teamHeader);

                const slotsContainer = document.createElement('div');
                slotsContainer.className = 'draft-slots';

                for (let r = 0; r < totalRounds; r++) {
                    const pickIndex = getPickIndex(r, t);
                    const slot = document.createElement('div');
                    slot.className = 'draft-slot';
                    slot.id = `slot-${pickIndex}`;
                    slot.innerHTML = `<span class="pick-num">${pickIndex + 1}</span>`;
                    slotsContainer.appendChild(slot);
                }

                teamCol.appendChild(slotsContainer);
                grid.appendChild(teamCol);
            }
            renderDraftState();
        }

        function getPickIndex(round, teamColIndex) {
            if (round % 2 === 0) {
                return round * totalTeams + teamColIndex;
            } else {
                return round * totalTeams + (totalTeams - 1 - teamColIndex);
            }
        }

        function getRoundAndTeamFromOverall(overallIndex) {
            const round = Math.floor(overallIndex / totalTeams);
            const remainder = overallIndex % totalTeams;
            let teamColIndex = (round % 2 === 0) ? remainder : (totalTeams - 1 - remainder);
            return { round, teamColIndex };
        }

        function getCurrentOverallPick() {
            for (let i = 0; i < draftPicks.length; i++) {
                if (!draftPicks[i]) return i;
            }
            return draftPicks.length;
        }

        function draftPlayer(playerId) {
            const currentPick = getCurrentOverallPick();
            if (currentPick >= draftPicks.length) return;

            const playerIndex = players.findIndex(p => p.id === playerId);
            if (playerIndex === -1) return;

            const player = players.splice(playerIndex, 1)[0];
            draftPicks[currentPick] = player;

            renderDraftState();
        }

        function undoPick(overallIndex) {
            const player = draftPicks[overallIndex];
            if (!player) return;

            draftPicks[overallIndex] = null;
            players.push(player);
            players.sort((a, b) => a.id - b.id);

            renderDraftState();
        }

        function renderDraftState() {
            for (let i = 0; i < draftPicks.length; i++) {
                const slot = document.getElementById(`slot-${i}`);
                const player = draftPicks[i];

                if (player) {
                    slot.className = 'draft-slot filled';
                    const posClass = `badge-${player.pos.toLowerCase()}`;
                    slot.innerHTML = `
                        <span class="pick-num">${i + 1}</span>
                        <div class="player-info">
                            <span class="p-name" title="${player.name}">${player.name}</span>
                            <span class="badge ${posClass}">${player.pos}</span>
                        </div>
                        <button class="undo-slot-btn" onclick="undoPick(${i})">Undo</button>
                    `;
                } else {
                    slot.className = 'draft-slot';
                    slot.innerHTML = `<span class="pick-num">${i + 1}</span>`;
                }
            }

            const currentPick = getCurrentOverallPick();
            document.getElementById('current-pick-counter').innerText = `Overall Pick: ${Math.min(currentPick + 1, totalTeams * totalRounds)}`;

            const otcTeamName = document.getElementById('otc-team-name');
            const otcPickInfo = document.getElementById('otc-pick-info');

            if (currentPick < draftPicks.length) {
                const { round, teamColIndex } = getRoundAndTeamFromOverall(currentPick);
                otcTeamName.innerText = teams[teamColIndex];
                otcPickInfo.innerText = `Round ${round + 1}, Pick ${(round % 2 === 0) ? (teamColIndex + 1) : (totalTeams - teamColIndex)}`;
            } else {
                otcTeamName.innerText = "Draft Complete";
                otcPickInfo.innerText = "All picks finished";
            }

            filterPlayers();
        }

        function filterPlayers() {
            const searchVal = document.getElementById('player-search').value.toLowerCase();
            const posVal = document.getElementById('pos-filter').value;
            const listContainer = document.getElementById('player-list');

            const filtered = players.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchVal) || p.team.toLowerCase().includes(searchVal);
                const matchesPos = (posVal === 'ALL' || p.pos === posVal);
                return matchesSearch && matchesPos;
            });

            listContainer.innerHTML = '';
            if (filtered.length === 0) {
                listContainer.innerHTML = `<div style="padding: 12px; font-size: 0.8rem; color: var(--text-muted); text-align: center;">No available players found</div>`;
                return;
            }

            filtered.forEach(p => {
                const item = document.createElement('div');
                item.className = 'player-item';
                const posClass = `badge-${p.pos.toLowerCase()}`;
                item.innerHTML = `
                    <div class="player-item-details">
                        <span class="player-item-name">${p.name}</span>
                        <span class="player-item-meta">${p.team} - <span class="badge ${posClass}">${p.pos}</span></span>
                    </div>
                `;
                item.onclick = () => draftPlayer(p.id);
                listContainer.appendChild(item);
            });
        }

        function resetDraft() {
            if (confirm("Are you sure you want to reset the entire draft?")) {
                location.reload();
            }
        }

        window.onload = () => {
            initBoard();
        };
    </script>
</body>
</html>
