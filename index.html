<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armchair Quarterback Challenge - Draft Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Local PapaParse (Bypasses Edge/Browser Third-Party Storage Restrictions) -->
    <script src="papaparse.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- TOP NAVIGATION / HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="bg-sky-600 p-2 rounded-lg text-white font-black tracking-wider text-lg shadow-inner">AQC</div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-white">Armchair Quarterback Challenge</h1>
                    <p class="text-xs text-slate-400">Live Draft War Room</p>
                </div>
            </div>

            <!-- Current Pick Indicator -->
            <div id="currentPickIndicator" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-lg text-sm text-center shadow-inner">
                Loading Draft State...
            </div>

            <!-- Controls & Actions -->
            <div class="flex items-center gap-2 flex-wrap justify-center">
                <button onclick="openRosterModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold rounded transition shadow">
                    View Rosters
                </button>
                <button onclick="triggerAutoDraft()" class="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-600 text-xs font-semibold rounded transition shadow text-white">
                    Auto-Draft Remaining
                </button>
                <button onclick="revertLastPick()" class="px-3 py-1.5 bg-amber-700 hover:bg-amber-600 text-xs font-semibold rounded transition shadow text-white">
                    Undo Last Pick
                </button>
                <button onclick="saveBoardCSV()" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-xs font-semibold rounded transition shadow text-white">
                    Export CSV
                </button>
            </div>
        </div>
    </header>

    <!-- SETUP BANNER (FALLBACK MANUAL UPLOAD IF NEEDED) -->
    <div id="setupBanner" class="bg-sky-900/40 border-b border-sky-700/50 p-3 text-center text-sm text-sky-200">
        <span>Attempting to read <code class="bg-sky-950 px-1.5 py-0.5 rounded text-sky-300 font-mono">draftorder.csv</code> and <code class="bg-sky-950 px-1.5 py-0.5 rounded text-sky-300 font-mono">players.csv</code> from server. Alternatively, upload players manually:</span>
        <input type="file" id="csvFileInput" accept=".csv" class="ml-2 text-xs file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-sky-700 file:text-white hover:file:bg-sky-600 cursor-pointer">
    </div>

    <!-- MAIN INTERACTIVE WAR ROOM -->
    <main class="max-w-7xl mx-auto p-4 flex-grow w-full flex flex-col gap-4">
        
        <!-- SEARCH & TIMER TOOLBAR -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-md">
            
            <!-- Player Search Box -->
            <div class="relative md:col-span-2">
                <label for="searchInput" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Search & Draft Player</label>
                <input type="text" id="searchInput" disabled placeholder="Waiting for player data..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500">
                
                <!-- Autocomplete Dropdown -->
                <div id="searchDropdown" class="absolute left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-lg shadow-xl max-h-60 overflow-y-auto hidden z-50"></div>
            </div>

            <!-- Timer Widget -->
            <div class="flex flex-col justify-between bg-slate-950 p-3 rounded-lg border border-slate-800">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400 font-semibold uppercase">Pick Timer</span>
                    <div class="space-x-1">
                        <button onclick="setTimerDuration(60)" class="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-[10px]">1m</button>
                        <button onclick="setTimerDuration(120)" class="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-[10px]">2m</button>
                        <button onclick="setTimerDuration(300)" class="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-[10px]">5m</button>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-2">
                    <span id="timerDisplay" class="text-2xl font-mono font-bold tracking-wider">2:00</span>
                    <div class="space-x-2">
                        <button id="timerToggleBtn" onclick="toggleTimer()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-bold text-xs shadow">Start Timer</button>
                        <button onclick="resetTimer()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">Reset</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- DRAFT BOARD CONTAINER -->
        <div class="bg-slate-900 rounded-xl border border-slate-800 shadow-xl overflow-hidden flex-grow flex flex-col">
            <div class="overflow-x-auto flex-grow max-h-[70vh]">
                <table class="w-full border-collapse text-left text-sm">
                    <tbody id="draftBoard">
                        <!-- Dynamically generated board rows/columns -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- ROSTER INSPECTOR MODAL -->
    <div id="rosterModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                <h2 class="text-xl font-bold text-white">Team Roster Inspector</h2>
                <button id="closeModalBtn" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
            </div>
            
            <div class="py-4">
                <label for="rosterTeamSelect" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Select Team</label>
                <select id="rosterTeamSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-sky-500"></select>
            </div>

            <div id="rosterModalContent" class="flex-grow overflow-y-auto">
                <!-- Dynamically populated team roster list -->
            </div>
        </div>
    </div>

    <!-- MAIN APPLICATION SCRIPT -->
    <script src="script.js"></script>
</body>
</html>
