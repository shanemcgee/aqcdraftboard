    Application: AQC 2026 Fantasy Football Draft Board (Read-Only Viewer with Team Roster Overlay)
    
    SECTION-BY-SECTION FUNCTIONAL BREAKDOWN:
    
    1. Header Bar (Title, Team Roster Viewer Button & Live Status)
       - Function: Displays the main application title, live synchronization status, 
         and a dedicated button to open the Team Roster overlay modal.
       - Automatically polls localStorage every 2 seconds to reflect real-time 
         draft picks and team name adjustments made by the commissioner.
    
    2. Team Roster Modal Overlay
       - Function: Allows league members to inspect the selections made by any specific 
         team manager in an organized list format.
       - Features a team dropdown selector, a summary count of drafted players, 
         and a clean table displaying Round, Pick #, Player Name, Position, Team, and Bye.
       - Closes via an 'X' button or clicking outside the modal box, returning seamlessly 
         to the draft board view.
    
    3. Draft Board Grid Table
       - Function: The core **10**-team, **15**-round serpentine draft visualization matrix.
       - Dynamically renders round numbers, team manager columns, and individual pick cells.
       - Automatically color-codes selected player cells based on position (QB, RB, WR, TE, K, DST) 
         with high-contrast text rules and tracks absolute pick numbers.
    ========================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQC 2026 Fantasy Football Draft Board - Live Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa; /* Subtle cool off-white/gray */
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(16, 37, 66, 0.08); /* Subtle navy shadow */
            border-top: 4px solid #1d3557; /* Subtle patriotic navy accent */
            border-radius: 4px;
        }

        /* Top Header Bar containing Title, Team Roster Button, and Status Indicator */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            color: #1d3557; /* Patriotic Navy */
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        button#viewTeamRosterBtn {
            background-color: #457b9d; /* Steel blue */
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button#viewTeamRosterBtn:hover {
            background-color: #36617d;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1faee;
            border: 1px solid #a8dadc;
            color: #1d3557;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #2a9d8f;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Modal Overlay Styles */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(13, 27, 42, 0.6); /* Dark semi-transparent backdrop */
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 25px;
            border: 1px solid #cbd5e1;
            width: 90%;
            max-width: 700px;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-modal-btn {
            color: #64748b;
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close-modal-btn:hover {
            color: #1d3557;
        }

        .modal-header {
            margin-top: 0;
            margin-bottom: 20px;
            color: #1d3557;
            font-size: 22px;
        }

        .roster-select-container {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .roster-select-container label {
            font-weight: bold;
            color: #1e293b;
            font-size: 14px;
        }

        .roster-select {
            background: #f8fafc;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            flex-grow: 1;
            max-width: 350px;
        }

        .roster-select:focus {
            outline: none;
            border-color: #457b9d;
            background-color: #fff;
        }

        .roster-table-container {
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }

        .roster-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .roster-table th, .roster-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .roster-table th {
            background-color: #1d3557;
            color: #fff;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .roster-table tr:hover {
            background-color: #f1f5f9;
        }

        .empty-roster-msg {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-style: italic;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid #cbd5e1;
            text-align: center;
            vertical-align: middle;
            padding: 4px;
            line-height: 1.2;
        }

        /* Round Column Header & Cells */
        th.round-th {
            width: 5%;
            background-color: #1d3557; /* Patriotic Navy */
            color: #fff;
            font-size: 14px;
        }

        td.round-td {
            width: 5%;
            background-color: #f1f5f9; /* Soft cool gray-blue tint */
            font-weight: bold;
            font-size: 13px;
            color: #1d3557;
            height: 60px;
        }

        /* Player Team Cells */
        td.player-td {
            width: 9.5%;
            height: 60px;
            background-color: #ffffff;
            position: relative;
        }

        th.team-th {
            width: 9.5%;
            background-color: #1d3557; /* Patriotic Navy */
            color: #fff;
            font-size: 14px;
        }

        /* Draft cell typography: Name is bold and larger than details */
        td .player-name {
            font-size: 15px;
            font-weight: bold;
        }

        td .player-details {
            font-size: 10px;
            font-weight: bold;
            margin-top: 2px;
        }

        /* Very small pick number in the bottom corner */
        td .pick-number {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 8px;
            font-weight: bold;
            opacity: 0.75;
            line-height: 1;
        }

        /* Position Color-Coding Classes (Set to opacity ~0.56, balancing a 7 on a 1-10 scale) */
        .QB-cell { 
            background-color: rgba(255, 165, 0, 0.56) !important; /* Orange */
            color: #0d1b2a !important;
        } 

        .RB-cell { 
            background-color: rgba(46, 125, 50, 0.53) !important; /* Green */
            color: #0d1b2a !important;
        } 

        .WR-cell { 
            background-color: rgba(255, 235, 59, 0.62) !important; /* Yellow */
            color: #0d1b2a !important;
        } 

        .TE-cell { 
            background-color: rgba(156, 39, 176, 0.50) !important; /* Purple */
            color: #0d1b2a !important;
        } 

        .K-cell { 
            background-color: rgba(244, 143, 177, 0.60) !important; /* Pink */
            color: #0d1b2a !important;
        } 

        .DST-cell { 
            background-color: rgba(183, 28, 28, 0.50) !important; /* Burgundy/Red */
            color: #0d1b2a !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Bar with Title, Roster Viewer Button, and Live Sync Indicator -->
        <div class="header-bar">
            <h1>AQC 2026 Fantasy Football Draft Board (Live Viewer)</h1>
            <div class="header-actions">
                <button id="viewTeamRosterBtn">View Team Rosters</button>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span id="syncStatusText">Synced with Draft</span>
                </div>
            </div>
        </div>

        <!-- Draft Board Grid Table with Round Column -->
        <div class="table-responsive">
            <table id="draftBoard">
                <thead>
                    <tr id="headerRow"></tr>
                </thead>
                <tbody id="boardBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Team Roster Modal Overlay -->
    <div id="rosterModal" class="modal-overlay">
        <div class="modal-content">
            <span id="closeModalBtn" class="close-modal-btn">&times;</span>
            <h2 class="modal-header">Team Roster Inspector</h2>
            
            <div class="roster-select-container">
                <label for="teamSelectDropdown">Select Team:</label>
                <select id="teamSelectDropdown" class="roster-select"></select>
            </div>

            <div class="roster-table-container">
                <table class="roster-table">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Round</th>
                            <th style="width: 15%;">Pick #</th>
                            <th style="width: 35%;">Player</th>
                            <th style="width: 15%;">Position</th>
                            <th style="width: 20%;">NFL Team</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTableBody">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let teamNames = [];
        let draftedPicksCache = [];
        const totalTeams = 10;
        const totalRounds = 15;
        let lastKnownStateString = "";

        const viewTeamRosterBtn = document.getElementById("viewTeamRosterBtn");
        const rosterModal = document.getElementById("rosterModal");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const teamSelectDropdown = document.getElementById("teamSelectDropdown");
        const rosterTableBody = document.getElementById("rosterTableBody");

        window.addEventListener("DOMContentLoaded", () => {
            loadTeamNames();
            initializeBoard();
            populateTeamDropdown();
            pollDraftState();

            // Poll localStorage every 2 seconds to automatically display live updates from the main draft board
            setInterval(pollDraftState, 2000);
        });

        // Modal Open / Close Event Handlers
        viewTeamRosterBtn.addEventListener("click", () => {
            populateTeamDropdown();
            renderTeamRoster();
            rosterModal.style.display = "flex";
        });

        closeModalBtn.addEventListener("click", () => {
            rosterModal.style.display = "none";
        });

        window.addEventListener("click", (e) => {
            if (e.target === rosterModal) {
                rosterModal.style.display = "none";
            }
        });

        teamSelectDropdown.addEventListener("change", () => {
            renderTeamRoster();
        });

        function loadTeamNames() {
            const savedTeams = localStorage.getItem("aqc_team_names");
            if (savedTeams) {
                try {
                    teamNames = JSON.parse(savedTeams);
                } catch (e) {
                    teamNames = [];
                }
            }
            if (!teamNames || teamNames.length !== totalTeams) {
                teamNames = [];
                for (let t = 1; t <= totalTeams; t++) {
                    teamNames.push(`Team ${t}`);
                }
            }
        }

        function populateTeamDropdown() {
            const currentSelectedValue = teamSelectDropdown.value;
            teamSelectDropdown.innerHTML = "";
            
            for (let t = 1; t <= totalTeams; t++) {
                const teamName = teamNames[t - 1] || `Team ${t}`;
                const option = document.createElement("option");
                option.value = t;
                option.textContent = `${t}. ${teamName}`;
                teamSelectDropdown.appendChild(option);
            }

            if (currentSelectedValue) {
                teamSelectDropdown.value = currentSelectedValue;
            }
        }

        function renderTeamRoster() {
            const selectedTeamNum = parseInt(teamSelectDropdown.value) || 1;
            rosterTableBody.innerHTML = "";

            // Filter picks belonging to the selected team number
            const teamPicks = draftedPicksCache.filter(pick => pick.team === selectedTeamNum);
            // Sort by round or pick number ascending
            teamPicks.sort((a, b) => a.pickNumber - b.pickNumber);

            if (teamPicks.length === 0) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 5;
                td.className = "empty-roster-msg";
                td.textContent = "No players drafted by this team yet.";
                tr.appendChild(td);
                rosterTableBody.appendChild(tr);
                return;
            }

            teamPicks.forEach(pick => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>Round ${pick.round}</strong></td>
                    <td>#${pick.pickNumber}</td>
                    <td><strong>${pick.playerObj.Player}</strong></td>
                    <td>${pick.playerObj.Position || "N/A"}</td>
                    <td>${pick.playerObj.Team || "N/A"}</td>
                `;
                rosterTableBody.appendChild(tr);
            });
        }

        function initializeBoard() {
            const headerRow = document.getElementById("headerRow");
            const boardBody = document.getElementById("boardBody");

            headerRow.innerHTML = "";
            boardBody.innerHTML = "";

            const roundTh = document.createElement("th");
            roundTh.textContent = "Round";
            roundTh.className = "round-th";
            headerRow.appendChild(roundTh);

            for (let t = 1; t <= totalTeams; t++) {
                const th = document.createElement("th");
                th.textContent = teamNames[t - 1] || `Team ${t}`;
                th.className = "team-th";
                headerRow.appendChild(th);
            }

            for (let r = 1; r <= totalRounds; r++) {
                const tr = document.createElement("tr");

                const roundTd = document.createElement("td");
                roundTd.textContent = r;
                roundTd.className = "round-td";
                tr.appendChild(roundTd);

                for (let t = 1; t <= totalTeams; t++) {
                    const td = document.createElement("td");
                    td.setAttribute("data-round", r);
                    td.setAttribute("data-team", t);
                    td.setAttribute("data-index", ((r - 1) * totalTeams) + (t - 1));
                    td.className = "player-td";
                    td.textContent = "";
                    tr.appendChild(td);
                }
                boardBody.appendChild(tr);
            }
        }

        // Updated: defensive parsing and early return if nothing changed
        function pollDraftState() {
            loadTeamNames();
            populateTeamDropdown();

            const savedDraftState = localStorage.getItem("aqc_draft_state");

            // If nothing changed, nothing to do
            if (savedDraftState === lastKnownStateString) {
                return;
            }

            // Attempt to parse first; if parse fails, don't update lastKnownStateString so we retry next poll
            let parsedState = [];
            if (savedDraftState) {
                try {
                    parsedState = JSON.parse(savedDraftState);
                } catch (e) {
                    console.error("Could not parse draft state", e);
                    return; // exit early and try again later
                }
            }

            // Only commit to the "last known" state after a successful parse
            lastKnownStateString = savedDraftState;
            draftedPicksCache = parsedState;

            // Clear existing cells first
            const allPlayerCells = document.querySelectorAll("td.player-td");
            allPlayerCells.forEach(cell => {
                cell.textContent = "";
                cell.className = "player-td";
            });

            // Render picks (parsedState is a validated array here)
            parsedState.forEach(pick => {
                const cellIndex = ((pick.round - 1) * totalTeams) + (pick.team - 1);
                const targetCell = document.querySelector(`td[data-index='${cellIndex}']`);
                if (targetCell) {
                    targetCell.innerHTML = `
                        <div class="player-name">${pick.playerObj.Player}</div>
                        <div class="player-details">${pick.playerObj.Position} - ${pick.playerObj.Team} | Bye: ${pick.playerObj.Bye}</div>
                        <div class="pick-number">${pick.pickNumber}</div>
                    `;
                    targetCell.className = "player-td";
                    const pos = pick.playerObj.Position ? pick.playerObj.Position.trim() : "";
                    targetCell.classList.add(`${pos}-cell`);
                }
            });

            // Re-initialize headers in case team names changed
            const headerThs = document.querySelectorAll("#headerRow th.team-th");
            headerThs.forEach((th, idx) => {
                th.textContent = teamNames[idx] || `Team ${idx + 1}`;
            });

            // Update roster modal view in real time if open
            if (rosterModal.style.display === "flex") {
                renderTeamRoster();
            }
        }

        // React immediately when localStorage is changed in another tab/window on the same origin
        window.addEventListener('storage', function(e) {
            if (!e) return;
            if (e.key === 'aqc_draft_state') {
                pollDraftState();
            } else if (e.key === 'aqc_team_names') {
                loadTeamNames();
                initializeBoard();
                pollDraftState();
            }
        });
    </script>
</body>
</html>
