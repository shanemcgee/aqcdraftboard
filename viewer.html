<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQC 2026 Fantasy Football Draft Board - Public Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(16, 37, 66, 0.08);
            border-top: 4px solid #1d3557;
            border-radius: 4px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            color: #1d3557;
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1d3557;
            color: #fff;
            padding: 8px 15px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .timer-display {
            font-size: 22px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
            min-width: 65px;
            text-align: center;
        }

        .timer-display.urgent {
            color: #ff6b6b;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Modal Overlay Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 25px;
            border: 1px solid #cbd5e1;
            width: 90%;
            max-width: 700px;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-modal-btn {
            color: #64748b;
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close-modal-btn:hover {
            color: #1d3557;
        }

        .modal-header {
            margin-top: 0;
            margin-bottom: 20px;
            color: #1d3557;
            font-size: 22px;
        }

        .roster-select-container {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .roster-select-container label {
            font-weight: bold;
            color: #1e293b;
            font-size: 14px;
        }

        .roster-select {
            background: #f8fafc;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            flex-grow: 1;
            max-width: 350px;
        }

        .roster-table-container {
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }

        .roster-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .roster-table th, .roster-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .roster-table th {
            background-color: #1d3557;
            color: #fff;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .roster-table tr:hover {
            background-color: #f1f5f9;
        }

        .empty-roster-msg {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-style: italic;
        }

        .controls-wrapper {
            background-color: #fff;
            padding-top: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 15px;
        }

        .controls-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        button#viewTeamRosterBtn {
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            background-color: #457b9d;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            white-space: nowrap;
        }

        button#viewTeamRosterBtn:hover {
            background-color: #36617d;
        }

        .table-responsive {
            max-height: 75vh;
            overflow-y: auto;
            overflow-x: auto;
            border: 1px solid #cbd5e1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid #cbd5e1;
            text-align: center;
            vertical-align: middle;
            padding: 4px;
            line-height: 1.2;
        }

        thead th {
            background-color: #1d3557;
            color: #fff;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th.round-th {
            width: 5%;
            z-index: 11;
        }

        td.round-td {
            width: 5%;
            background-color: #f1f5f9;
            font-weight: bold;
            font-size: 13px;
            color: #1d3557;
            height: 60px;
        }

        td.player-td {
            width: 9.5%;
            height: 60px;
            background-color: #ffffff;
            position: relative;
        }

        th.team-th {
            width: 9.5%;
        }

        td .player-name {
            font-size: 15px;
            font-weight: bold;
        }

        td .player-details {
            font-size: 10px;
            font-weight: bold;
            margin-top: 2px;
        }

        td .pick-number {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 8px;
            font-weight: bold;
            opacity: 0.75;
            line-height: 1;
        }

        /* Position Color-Coding Classes */
        .QB-cell { 
            background-color: rgba(255, 165, 0, 0.56) !important;
            color: #0d1b2a !important;
        } 
        .RB-cell { 
            background-color: rgba(46, 125, 50, 0.53) !important;
            color: #0d1b2a !important;
        } 
        .WR-cell { 
            background-color: rgba(255, 235, 59, 0.62) !important;
            color: #0d1b2a !important;
        } 
        .TE-cell { 
            background-color: rgba(156, 39, 176, 0.50) !important;
            color: #0d1b2a !important;
        } 
        .K-cell { 
            background-color: rgba(244, 143, 177, 0.60) !important;
            color: #0d1b2a !important;
        } 
        .DST-cell { 
            background-color: rgba(183, 28, 28, 0.50) !important;
            color: #0d1b2a !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Bar with Title & Timer -->
        <div class="header-bar">
            <h1>AQC 2026 Fantasy Football Draft Board (Viewer)</h1>
            <div class="header-right-group">
                <div class="timer-container">
                    <div id="timerDisplay" class="timer-display">--:--</div>
                </div>
            </div>
        </div>

        <!-- Viewer Control Deck -->
        <div class="controls-wrapper">
            <div class="controls-container">
                <button id="viewTeamRosterBtn">View Team Rosters</button>
            </div>
        </div>

        <!-- Draft Board Grid Table -->
        <div class="table-responsive">
            <table id="draftBoard">
                <thead>
                    <tr id="headerRow"></tr>
                </thead>
                <tbody id="boardBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Team Roster Modal Overlay -->
    <div id="rosterModal" class="modal-overlay">
        <div class="modal-content">
            <span id="closeModalBtn" class="close-modal-btn">&times;</span>
            <h2 class="modal-header">Team Roster Inspector</h2>
            
            <div class="roster-select-container">
                <label for="teamSelectDropdown">Select Team:</label>
                <select id="teamSelectDropdown" class="roster-select"></select>
            </div>

            <div class="roster-table-container">
                <table class="roster-table">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Round</th>
                            <th style="width: 15%;">Pick #</th>
                            <th style="width: 35%;">Player</th>
                            <th style="width: 15%;">Position</th>
                            <th style="width: 20%;">NFL Team</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTableBody">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Local PapaParse lightweight CSV parser reference -->
    <script src="papaparse.min.js"></script>
    <script>
        let teamNames = [];
        let draftedPicksHistory = [];
        const totalTeams = 10;
        const totalRounds = 15;

        const viewTeamRosterBtn = document.getElementById("viewTeamRosterBtn");
        const rosterModal = document.getElementById("rosterModal");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const teamSelectDropdown = document.getElementById("teamSelectDropdown");
        const rosterTableBody = document.getElementById("rosterTableBody");
        const timerDisplay = document.getElementById("timerDisplay");

        window.addEventListener("DOMContentLoaded", () => {
            loadTeamNamesFromStorage();
            initializeBoard();
            populateTeamDropdown();
            loadDraftState();

            // Poll localStorage every 1 second to sync live draft changes from the admin page
            setInterval(() => {
                loadDraftState();
            }, 1000);
        });

        viewTeamRosterBtn.addEventListener("click", () => {
            populateTeamDropdown();
            renderTeamRoster();
            rosterModal.style.display = "flex";
        });

        closeModalBtn.addEventListener("click", () => {
            rosterModal.style.display = "none";
        });

        window.addEventListener("click", (e) => {
            if (e.target === rosterModal) {
                rosterModal.style.display = "none";
            }
        });

        teamSelectDropdown.addEventListener("change", () => {
            renderTeamRoster();
        });

        function loadTeamNamesFromStorage() {
            const savedNames = localStorage.getItem("aqc_team_names");
            if (savedNames) {
                try {
                    teamNames = JSON.parse(savedNames);
                } catch(e) {
                    teamNames = [];
                }
            }
            if (!teamNames || teamNames.length !== totalTeams) {
                teamNames = [
                    "Team 1", "Team 2", "Team 3", "Team 4", "Team 5",
                    "Team 6", "Team 7", "Team 8", "Team 9", "Team 10"
                ];
            }
        }

        function initializeBoard() {
            const headerRow = document.getElementById("headerRow");
            headerRow.innerHTML = "";

            const roundTh = document.createElement("th");
            roundTh.className = "round-th";
            roundTh.textContent = "Rnd";
            headerRow.appendChild(roundTh);

            for (let t = 1; t <= totalTeams; t++) {
                const th = document.createElement("th");
                th.className = "team-th";
                th.textContent = teamNames[t - 1] || `Team ${t}`;
                headerRow.appendChild(th);
            }

            const boardBody = document.getElementById("boardBody");
            boardBody.innerHTML = "";

            let pickCounter = 1;
            for (let r = 1; r <= totalRounds; r++) {
                const tr = document.createElement("tr");

                const roundTd = document.createElement("td");
                roundTd.className = "round-td";
                roundTd.textContent = r;
                tr.appendChild(roundTd);

                for (let t = 1; t <= totalTeams; t++) {
                    const td = document.createElement("td");
                    td.className = "player-td";
                    td.id = `cell-r${r}-t${t}`;
                    td.dataset.round = r;
                    td.dataset.team = t;
                    td.dataset.pick = pickCounter;

                    const pickSpan = document.createElement("div");
                    pickSpan.className = "pick-number";
                    pickSpan.textContent = pickCounter;
                    td.appendChild(pickSpan);

                    tr.appendChild(td);
                    pickCounter++;
                }
                boardBody.appendChild(tr);
            }
        }

        function loadDraftState() {
            const savedDraftState = localStorage.getItem("aqc_draft_state");
            if (savedDraftState) {
                try {
                    const parsedState = JSON.parse(savedDraftState);
                    draftedPicksHistory = parsedState;
                    
                    // Reset grid cells first
                    for (let r = 1; r <= totalRounds; r++) {
                        for (let t = 1; t <= totalTeams; t++) {
                            const cell = document.getElementById(`cell-r${r}-t${t}`);
                            if (cell && !cell.querySelector('.player-name')) {
                                // Keep clean if unpicked
                            }
                        }
                    }

                    parsedState.forEach(pick => {
                        applyPickToBoard(pick.round, pick.team, pick.playerObj, pick.pickNumber);
                    });
                } catch (e) {
                    console.error("Could not load draft state", e);
                }
            }
        }

        function applyPickToBoard(round, team, playerObj, pickNumber) {
            const cell = document.getElementById(`cell-r${round}-t${team}`);
            if (!cell) return;

            // Avoid re-rendering if already matches
            const existingName = cell.querySelector('.player-name');
            if (existingName && existingName.textContent === playerObj.Player) {
                return;
            }

            cell.innerHTML = "";
            const posClass = playerObj.Position ? `${playerObj.Position.trim().toUpperCase()}-cell` : "";
            cell.className = `player-td ${posClass}`;

            const nameDiv = document.createElement("div");
            nameDiv.className = "player-name";
            nameDiv.textContent = playerObj.Player;

            const detailsDiv = document.createElement("div");
            detailsDiv.className = "player-details";
            detailsDiv.textContent = `${playerObj.Position || ''} - ${playerObj.Team || ''}`;

            const pickSpan = document.createElement("div");
            pickSpan.className = "pick-number";
            pickSpan.textContent = pickNumber;

            cell.appendChild(nameDiv);
            cell.appendChild(detailsDiv);
            cell.appendChild(pickSpan);
        }

        function populateTeamDropdown() {
            const currentSelectedValue = teamSelectDropdown.value;
            teamSelectDropdown.innerHTML = "";
            
            for (let t = 1; t <= totalTeams; t++) {
                const teamName = teamNames[t - 1] || `Team ${t}`;
                const option = document.createElement("option");
                option.value = t;
                option.textContent = `${t}. ${teamName}`;
                teamSelectDropdown.appendChild(option);
            }

            if (currentSelectedValue) {
                teamSelectDropdown.value = currentSelectedValue;
            }
        }

        function renderTeamRoster() {
            const selectedTeamNum = parseInt(teamSelectDropdown.value) || 1;
            rosterTableBody.innerHTML = "";

            const teamPicks = draftedPicksHistory.filter(p => p.team === selectedTeamNum);

            if (teamPicks.length === 0) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 5;
                td.className = "empty-roster-msg";
                td.textContent = "No players drafted for this team yet.";
                tr.appendChild(td);
                rosterTableBody.appendChild(tr);
                return;
            }

            teamPicks.sort((a, b) => a.pickNumber - b.pickNumber);

            teamPicks.forEach(pick => {
                const tr = document.createElement("tr");
                
                const tdRound = document.createElement("td");
                tdRound.textContent = `Round ${pick.round}`;
                
                const tdPick = document.createElement("td");
                tdPick.textContent = pick.pickNumber;
                
                const tdPlayer = document.createElement("td");
                tdPlayer.style.fontWeight = "bold";
                tdPlayer.textContent = pick.playerObj.Player || "Unknown";
                
                const tdPos = document.createElement("td");
                tdPos.textContent = pick.playerObj.Position || "-";
                
                const tdTeam = document.createElement("td");
                tdTeam.textContent = pick.playerObj.Team || "-";

                tr.appendChild(tdRound);
                tr.appendChild(tdPick);
                tr.appendChild(tdPlayer);
                tr.appendChild(tdPos);
                tr.appendChild(tdTeam);

                rosterTableBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
